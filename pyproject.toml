[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hackagent"
version = "0.1.0"
description = "Policy-supervised Python and LLM security operator"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "CCO Maintainers" }]
dependencies = ["chromadb>=1.5,<2", "cryptography>=46,<50", "grpcio-reflection>=1.82,<2", "jsonschema>=4.26,<5", "mcp>=1.27,<2", "networkx>=3.6,<4", "referencing>=0.37,<1", "requests>=2.33,<3", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest", "kuzu>=0.11,<0.12", "build==1.4.3", "setuptools==82.0.1", "wheel==0.47.0", "ruff", "mypy", "coverage"]
mcp = ["kuzu>=0.11,<0.12"]
benchmark = ["tiktoken>=0.12,<0.13"]

[project.scripts]
cco-agent = "scripts.agent_cli:main"
cco-operator = "scripts.operator_cli:main"
cco-campaign = "scripts.campaign_runtime:main"
cco-worker = "scripts.campaign_worker:main"
cco-worker-soak = "scripts.worker_soak:main"
cco-governance = "scripts.governance_audit:main"
cco-policy = "scripts.policy_gate_cli:main"
cco-release-check = "scripts.release_check:main"
cco-release-artifacts = "scripts.release_artifacts:main"
cco-rag-bootstrap = "scripts.rag_bootstrap:main"
cco-finding-migration = "scripts.finding_migration:main"
cco-engagement = "scripts.engagement_workspace:main"

[tool.setuptools]
packages = ["scripts", "cco_rag_core"]
include-package-data = false

[tool.setuptools.package-dir]
cco_rag_core = "mcp-servers/mcp-rag-engine/cco_rag_core"

[tool.setuptools.package-data]
scripts = ["*.sh", "lab/*.py", "xbow_bench_fixtures/**/*.json"]

[tool.setuptools.data-files]
"share/hackagent" = ["pyproject.toml", "requirements.lock", "config/tool-capabilities.json", "config/executor-contract.example.json"]
"share/hackagent/scripts" = ["scripts/*.py"]
"share/hackagent/scripts/lab" = ["scripts/lab/*.py", "scripts/lab/Dockerfile", "scripts/lab/docker-compose.yml", "scripts/lab/README.md"]
"share/hackagent/config" = ["config/llm.example.json", "config/profiles.json", "config/mcp-servers.json", "config/bounty-program-policy.json", "config/executor-contract.example.json", "config/mcp-core-tools.json", "config/tool-capabilities.json"]
"share/hackagent/config/program-profiles" = ["config/program-profiles/ctf.json", "config/program-profiles/lab.json", "config/program-profiles/strict-bounty.json", "config/program-profiles/strict-bounty-anduril.json", "config/program-profiles/strict-bounty-clear.json", "config/program-profiles/strict-bounty-coupang.json", "config/program-profiles/strict-bounty-expedia.json", "config/program-profiles/strict-bounty-livenation.json", "config/program-profiles/strict-bounty-rapyd.json", "config/program-profiles/vdp-nebius.json"]
"share/hackagent/mcp-servers/mcp-ad-tools" = ["mcp-servers/mcp-ad-tools/server.py"]
"share/hackagent/mcp-servers/mcp-agent-browse" = ["mcp-servers/mcp-agent-browse/server.py"]
"share/hackagent/mcp-servers/mcp-browser" = ["mcp-servers/mcp-browser/server.py"]
"share/hackagent/mcp-servers/mcp-browser/cco_browser_core" = ["mcp-servers/mcp-browser/cco_browser_core/*.py"]
"share/hackagent/mcp-servers/mcp-container-tools" = ["mcp-servers/mcp-container-tools/server.py"]
"share/hackagent/mcp-servers/mcp-ctf-platform" = ["mcp-servers/mcp-ctf-platform/server.py"]
"share/hackagent/mcp-servers/mcp-hunter" = ["mcp-servers/mcp-hunter/server.py"]
"share/hackagent/mcp-servers/mcp-hunter/cco_hunter_core" = ["mcp-servers/mcp-hunter/cco_hunter_core/*.py"]
"share/hackagent/mcp-servers/mcp-kali-tools" = ["mcp-servers/mcp-kali-tools/server.py"]
"share/hackagent/mcp-servers/mcp-kali-tools/cco_js_core" = ["mcp-servers/mcp-kali-tools/cco_js_core/*.py"]
"share/hackagent/mcp-servers/mcp-kali-tools/cco_postex_core" = ["mcp-servers/mcp-kali-tools/cco_postex_core/*.py"]
"share/hackagent/mcp-servers/mcp-llm-security" = ["mcp-servers/mcp-llm-security/server.py"]
"share/hackagent/mcp-servers/mcp-memory-server" = ["mcp-servers/mcp-memory-server/*.py"]
"share/hackagent/mcp-servers/mcp-memory-server/cco_surface_core" = ["mcp-servers/mcp-memory-server/cco_surface_core/*.py"]
"share/hackagent/mcp-servers/mcp-osint-tools" = ["mcp-servers/mcp-osint-tools/server.py"]
"share/hackagent/mcp-servers/mcp-otp" = ["mcp-servers/mcp-otp/*.py"]
"share/hackagent/mcp-servers/mcp-rag-engine" = ["mcp-servers/mcp-rag-engine/server.py", "mcp-servers/mcp-rag-engine/requirements.txt"]
"share/hackagent/mcp-servers/mcp-rag-engine/cco_rag_core" = ["mcp-servers/mcp-rag-engine/cco_rag_core/*.py"]
"share/hackagent/mcp-servers/mcp-reasoning" = ["mcp-servers/mcp-reasoning/server.py"]
"share/hackagent/mcp-servers/mcp-reasoning/cco_reasoning_core" = ["mcp-servers/mcp-reasoning/cco_reasoning_core/*.py"]
"share/hackagent/mcp-servers/mcp-telemetry" = ["mcp-servers/mcp-telemetry/server.py"]
"share/hackagent/mcp-servers/mcp-telemetry/cco_telemetry_core" = ["mcp-servers/mcp-telemetry/cco_telemetry_core/*.py"]
"share/hackagent/mcp-servers/mcp-validator" = ["mcp-servers/mcp-validator/server.py"]
"share/hackagent/mcp-servers/mcp-validator/cco_validator_core" = ["mcp-servers/mcp-validator/cco_validator_core/*.py"]
"share/hackagent/mcp-servers/mcp-web-advanced" = ["mcp-servers/mcp-web-advanced/server.py"]

[tool.ruff]
target-version = "py312"

# Ratchet: CI blocking set is intentionally narrow (syntax/pyflakes-critical).
# Widen `select` only after the wider findings are cleaned per package.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
mypy_path = "scripts"
warn_unused_ignores = false
# The CI core gate checks its explicit entrypoints. MCP runtime imports are
# tested separately and can be loaded as both package and standalone modules.
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.cco]
product = "policy-supervised autonomous security operator"
quality_gate = [
  "python3 -m pytest tests -q",
  "python3 scripts/worker_soak.py --tasks 16 --workers 4 --stale-claims 2 --executor synthetic --max-tasks 16 --json",
  "python3 scripts/release_artifacts.py check-lock",
  "python3 scripts/lab-validate.py --skip-rag --quiet --json",
  "python3 scripts/agent_cli.py check-config --provider-config config/llm.example.json",
  "python3 scripts/governance_audit.py --root scripts --format json --fail-on high",
  "python3 scripts/check_repo_layout.py",
]
