[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hackagent"
version = "0.1.0"
description = "Policy-supervised Python and LLM security operator"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CCO Maintainers" }]
dependencies = ["chromadb>=1.5,<2", "cryptography>=46,<50", "grpcio-reflection>=1.82,<2", "jinja2>=3.1,<4", "jsonschema>=4.26,<5", "mcp>=1.27,<2", "networkx>=3.6,<4", "playwright>=1.65,<2", "referencing>=0.37,<1", "requests>=2.33,<3", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest", "kuzu>=0.11,<0.12", "build==1.4.3", "setuptools==82.0.1", "wheel==0.47.0", "ruff", "mypy", "coverage"]
mcp = ["kuzu>=0.11,<0.12"]
benchmark = ["tiktoken>=0.12,<0.13"]

[project.scripts]
cco-agent = "scripts.agent_cli:main"
cco-governance = "scripts.governance_audit:main"
cco-release-check = "scripts.release_check:main"
cco-release-artifacts = "scripts.release_artifacts:main"

[tool.setuptools]
packages = [
  "scripts",
  "kryon_core",
  "kryon_core.surface",
  "kryon_core.browser",
  "kryon_core.js",
  "kryon_core.waf",
  "kryon_core.validator",
  "kryon_core.vault",
  "kryon_core.protocol",
]
include-package-data = false

[tool.setuptools.package-data]
scripts = ["*.sh"]

[tool.setuptools.data-files]
"share/hackagent" = ["pyproject.toml", "requirements.lock"]
"share/hackagent/scripts" = ["scripts/*.py"]
"share/hackagent/config" = ["config/llm.example.json", "config/bounty-program-policy.json", "config/run.example.json"]

[tool.ruff]
target-version = "py312"

# Ratchet: CI blocking set uses central pyproject config across the repository.
[tool.ruff.lint]
select = [
  "E9",
  "F63",
  "F7",
  "F82",
  "F541",
  "F841",
  "E722",
  "F601",
  "F602",
  "F621",
  "F622",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["scripts", "."]
check_untyped_defs = true
warn_unused_ignores = false
follow_imports = "skip"
files = [
  "scripts/agent_cli.py",
  "scripts/agentic_auth_import.py",
  "scripts/agentic_browser.py",
  "scripts/agentic_bsag.py",
  "scripts/agentic_context.py",
  "scripts/agentic_crypto.py",
  "scripts/agentic_evidence.py",
  "scripts/agentic_graphql.py",
  "scripts/agentic_har_flow.py",
  "scripts/agentic_http.py",
  "scripts/agentic_investigator.py",
  "scripts/agentic_oob.py",
  "scripts/agentic_oracle.py",
  "scripts/agentic_prescan.py",
  "scripts/agentic_presets.py",
  "scripts/agentic_preview.py",
  "scripts/agentic_receipts.py",
  "scripts/agentic_recon.py",
  "scripts/agentic_report.py",
  "scripts/agentic_runner.py",
  "scripts/agentic_scheduler.py",
  "scripts/agentic_seed.py",
  "scripts/agentic_sharding.py",
  "scripts/agentic_stage0_crawl.py",
  "scripts/agentic_surface.py",
  "scripts/agentic_surface_map.py",
  "scripts/agentic_telemetry.py",
  "scripts/agentic_tools.py",
  "scripts/agentic_tui.py",
  "scripts/agentic_vault.py",
  "scripts/agentic_waf.py",
  "scripts/agentic_wizard.py",
  "scripts/check_repo_layout.py",
  "scripts/evidence_trust.py",
  "scripts/full_agent_budget.py",
  "scripts/full_agent_provider.py",
  "scripts/governance_audit.py",
  "scripts/llm_config.py",
  "scripts/provider_auth.py",
  "scripts/release_artifacts.py",
  "scripts/release_check.py",
  "scripts/runtime_paths.py",
  "scripts/save_browser_auth.py",
  "scripts/target_bootstrap.py",
  "scripts/tech_routes.py",
  "scripts/wire_budget.py",
  "kryon_core",
]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "tiktoken", "tiktoken.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "-q"

[tool.cco]
product = "policy-supervised autonomous security operator"
quality_gate = [
  "python3 -m ruff check .",
  "python3 -m mypy",
  "python3 -m pytest tests -q",
  "python3 scripts/release_artifacts.py check-lock",
  "python3 scripts/agent_cli.py check-config --provider-config config/llm.example.json",
  "python3 scripts/governance_audit.py --root scripts --format json --fail-on high",
  "python3 scripts/governance_audit.py --root kryon_core --format json --fail-on high",
  "python3 scripts/check_repo_layout.py",
]
