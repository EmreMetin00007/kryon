name: cco-signed-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation .

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION"

      - name: Run release quality gate
        env:
          CCO_GRAPH_BACKEND: networkx
        run: python3 scripts/release_check.py

      - name: Load production signing trust
        env:
          CCO_RELEASE_PRIVATE_KEY_B64: ${{ secrets.CCO_RELEASE_PRIVATE_KEY_B64 }}
          CCO_RELEASE_PUBLIC_KEY_B64: ${{ secrets.CCO_RELEASE_PUBLIC_KEY_B64 }}
        run: |
          test -n "$CCO_RELEASE_PRIVATE_KEY_B64"
          test -n "$CCO_RELEASE_PUBLIC_KEY_B64"
          umask 077
          printf '%s' "$CCO_RELEASE_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/cco-release-key.pem"
          printf '%s' "$CCO_RELEASE_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/cco-release-public.pem"

      - name: Build reproducibly and sign
        run: python3 scripts/release_artifacts.py build --output-dir dist/release --private-key "$RUNNER_TEMP/cco-release-key.pem" --verify-reproducible

      - name: Verify signed bundle
        run: python3 scripts/release_artifacts.py verify --release-dir dist/release --public-key "$RUNNER_TEMP/cco-release-public.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: cco-signed-release-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --generate-notes
