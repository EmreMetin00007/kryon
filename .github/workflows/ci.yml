name: cco-quality-gate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Install Playwright Chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Validate dependency lock
        run: python3 scripts/release_artifacts.py check-lock

      - name: Check repository layout
        run: python3 scripts/check_repo_layout.py

      - name: Install lint tools
        run: python -m pip install ruff mypy coverage

      - name: Ruff (blocking, central pyproject config)
        run: ruff check .

      - name: Mypy core (blocking, central pyproject config)
        run: mypy

      - name: Run unit tests (coverage)
        env:
          COVERAGE_FILE: /tmp/.coverage-ci
        run: |
          coverage run -m pytest tests -q
          coverage report --include="scripts/agentic_*.py,scripts/target_bootstrap.py,kryon_core/*" | tee /tmp/coverage-core.txt

      - name: Check Python provider configuration
        run: python3 scripts/agent_cli.py check-config --provider-config config/llm.example.json

      - name: Governance audit smoke (scripts)
        run: python3 scripts/governance_audit.py --root scripts --format json --fail-on high

      - name: Governance audit smoke (kryon_core)
        run: python3 scripts/governance_audit.py --root kryon_core --format json --fail-on high

      - name: Signed release bundle smoke
        run: |
          python3 scripts/release_artifacts.py build --output-dir /tmp/cco-release-smoke --ephemeral-key --no-verify-reproducible
          python3 scripts/release_artifacts.py verify --release-dir /tmp/cco-release-smoke --public-key /tmp/cco-release-smoke/release-public-key.pem

      - name: Release gate smoke
        run: python3 scripts/release_check.py --list
